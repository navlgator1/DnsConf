name: DNS Block&Redirect Configurer cron task

on:
  schedule:
    - cron: '47 0 * * *' # 03:47 MSK (00:47 UTC)
  workflow_dispatch:

# Two runs at once read and write the same dns profile, so a new run replaces the one in progress
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: DNS

    env:
      DNS: ${{ vars.DNS }}
      BLOCK: ${{ vars.BLOCK }}
      REDIRECT: ${{ vars.REDIRECT }}
      EXCLUDE_REDIRECT: ${{ vars.EXCLUDE_REDIRECT }}
      DONOR_DNS: ${{ vars.DONOR_DNS }}

      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

      TZ: Europe/Moscow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Run application
        run: |
          echo "Starting application..."
          java --enable-preview -jar target/*.jar
